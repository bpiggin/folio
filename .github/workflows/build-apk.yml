name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npx eslint .

      - name: Generate native Android project
        env:
          # Optional repo variable for forks; defaults to the package in app.json.
          FOLIO_ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
        run: npx expo prebuild --platform android --no-install

      # Optional: sign with your own key instead of the shared React Native debug key.
      # See README → "Using your own signing key".
      - name: Use private signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > android/app/debug.keystore

      - name: Print signing certificate SHA-1
        run: keytool -list -v -keystore android/app/debug.keystore -storepass android | grep -E 'SHA1:'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk folio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: folio.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Folio build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            On your phone, tap **folio.apk** below to download and install it.
          files: folio.apk
          make_latest: true
